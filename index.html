<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Robot</title>

<style>
html,body{margin:0;background:black;overflow:hidden;font-family:sans-serif;height:100%;}
#screen{width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;gap:6vw;}
.eye{width:42vw;height:14vh;background:#9b4dff;border-radius:12px;
box-shadow:0 0 40px #9b4dff,0 0 80px #7a2cff,inset 0 0 20px rgba(255,255,255,0.3),inset 0 -15px 30px rgba(0,0,0,0.4);
transition:0.3s;}
#fullscreenBtn{
    position:fixed;
    top:10px;
    left:10px;
    z-index:9999;
    background: rgba(155,77,255,0.4); /* прозрачный фиолетовый */
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
    font-size:12px;
    cursor:pointer;
    transition:0.3s;
}
#fullscreenBtn:hover{
    background: rgba(155,77,255,0.7);
}
#menu,#pay{position:fixed;top:0;left:0;width:100%;height:100%;background:#12001a;display:none;flex-direction:column;align-items:center;color:white;overflow:auto;}
.title{font-size:30px;margin:20px;}
.categories{display:flex;gap:20px;margin-bottom:10px;}
.categories button{background:#9b4dff;border:none;padding:12px 18px;border-radius:10px;color:white;font-size:18px;cursor:pointer;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;}
.card{background:#1b002e;border-radius:16px;box-shadow:0 0 25px #9b4dff;padding:10px;text-align:center;}
.card img{width:42vw;height:22vh;object-fit:cover;border-radius:10px;}
.card h3{margin:8px 0 4px;}
.card p{margin:0;color:#ccc;}
.card button{margin-top:8px;background:#9b4dff;border:none;padding:8px 12px;border-radius:8px;color:white;cursor:pointer;}
.payBox{background:#1b002e;padding:30px;border-radius:20px;box-shadow:0 0 30px #9b4dff;text-align:center;margin-top:100px;}
.payBox button{margin-top:10px;}
</style>
</head>

<body>

<button id="fullscreenBtn" onclick="goFullscreen()">⛶</button>

<div id="screen">
    <div class="eye"></div>
    <div class="eye"></div>
</div>

<div id="menu">
<div class="title">Меню</div>

<div class="categories">
    <button onclick="food()">🍔 Еда</button>
    <button onclick="office()">✏ Канцелярия</button>
    <button onclick="closeMenu()">⬅ Назад</button>
</div>

<div id="items" class="grid"></div>
</div>

<div id="pay">
<div class="payBox">
    <h2>Оплата</h2>
    <p id="product"></p>
    <button onclick="confirmPay()">💳 Оплатить</button>
    <button onclick="cancelPay()">⬅ Назад</button>
</div>
</div>

<script>
// функция полноэкранного режима
function goFullscreen(){
    let elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
    }
}

// три клика по глазам открывают меню
let clicks=0;
document.querySelectorAll(".eye").forEach(e=>{
    e.onclick=()=>{
        clicks++;
        if(clicks==3){
            menu.style.display="flex";
            clicks=0;
        }
    }
});

function closeMenu(){
    menu.style.display="none";
    items.innerHTML="";
}

function selectItem(name,price){
    product.innerText=name+" — "+price;
    menu.style.display="none";
    pay.style.display="flex";
}

function confirmPay(){
    let msg=new SpeechSynthesisUtterance("Заказ принят");
    msg.lang="ru-RU";
    speechSynthesis.speak(msg);
    pay.innerHTML=`
    <div class="payBox">
        <h2>✅ Заказ принят</h2>
        <button onclick="location.reload()">Вернуться</button>
    </div>`;
}

function cancelPay(){
    pay.style.display="none";
    menu.style.display="flex";
}

// ЕДА
function food(){
    items.innerHTML=`
    <div class="card">
        <img src="https://avatars.mds.yandex.net/get-entity_search/2040540/1237300690/S600xU_2x">
        <h3>Хотдог</h3><p>150 ₽</p>
        <button onclick="selectItem('Хотдог','150 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://img.povar.ru/mobile/74/21/9a/af/meksikanskaya_ostraya_picca-864248.JPG">
        <h3>Пицца</h3><p>300 ₽</p>
        <button onclick="selectItem('Пицца','300 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://avatars.mds.yandex.net/get-entity_search/5509992/1248226391/S600xU_2x">
        <h3>Бургер</h3><p>250 ₽</p>
        <button onclick="selectItem('Бургер','250 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://avatars.mds.yandex.net/get-entity_search/5098055/1229408585/S600xU_2x">
        <h3>Бутерброд</h3><p>150 ₽</p>
        <button onclick="selectItem('Бутерброд','150 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://avatars.mds.yandex.net/i?id=76b4b6b59652a1ab9d97ebf45a29d681_l-5447262-images-thumbs&ref=rim&n=13&w=800&h=800">
        <h3>Картошка фри</h3><p>100 ₽</p>
        <button onclick="selectItem('Фри','100 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://avatars.mds.yandex.net/i?id=2296b0d89a459fc3c08f83461d399b08_l-5749428-images-thumbs&n=13">
        <h3>Салат</h3><p>200 ₽</p>
        <button onclick="selectItem('Салат','200 ₽')">Заказать</button>
    </div>
    `;
}

// КАНЦЕЛЯРИЯ
function office(){
    items.innerHTML=`
    <div class="card">
        <img src="https://avatars.mds.yandex.net/i?id=a97862084887480f9a5c0313049fc016_sr-7683610-images-thumbs&n=13">
        <h3>Маркер</h3><p>120 ₽</p>
        <button onclick="selectItem('Маркер','120 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://avelot.ru/upload/iblock/f91/ufbbw8pgto2ep8hauwuru1qr94uhpvx3/lastik_koh_i_noor_6312_karandash_6312036001td.jpg">
        <h3>Карандаш</h3><p>50 ₽</p>
        <button onclick="selectItem('Карандаш','50 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://avatars.mds.yandex.net/i?id=fb39a836e5520a93af757753a43bc318_l-14907266-images-thumbs&n=13">
        <h3>Ластик</h3><p>40 ₽</p>
        <button onclick="selectItem('Ластик','40 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://storage.yandexcloud.net/mostro-gm-media/d7c3392d-c86a-ab3c-c337-c04bab8f3080/5R00RAD.jpg">
        <h3>Стружилка</h3><p>70 ₽</p>
        <button onclick="selectItem('Стружилка','70 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://ir.ozone.ru/s3/multimedia-j/c600/6338507227.jpg">
        <h3>Ручка</h3><p>60 ₽</p>
        <button onclick="selectItem('Ручка','60 ₽')">Заказать</button>
    </div>
    <div class="card">
        <img src="https://main-cdn.sbermegamarket.ru/big1/hlr-system/843/373/478/122/112/4/100062614347b0.jpeg">
        <h3>Тетрадь</h3><p>80 ₽</p>
        <button onclick="selectItem('Тетрадь','80 ₽')">Заказать</button>
    </div>
    `;
}
</script>
</body>
</html>
